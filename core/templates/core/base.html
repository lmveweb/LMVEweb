{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMVE | Liga Metropolitana de Voleibol Escolar</title>
    
    <!-- Cargamos Three.js desde CDN para el motor 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* =========================================================
           PALETA OFICIAL LMVE (Manual de Marca — Identidad Web 2026-27)
           Base: Azul + Blanco. Naranja: CTA/momentos decisivos.
           Verde: organiza información. Amarillo Anaranjado: elegancia
           (uso selectivo). Rojo: reservado para momentos a destacar.
           ========================================================= */
        :root {
            --color-bg: #f7f9fb;           --color-bg-rgb: 247, 249, 251;
            --color-ink: #203a69;          --color-ink-rgb: 32, 58, 105;
            --color-ink-soft: #111820;
            --color-ink-muted: #64717e;
            --color-ink-faint: #93a0ac;
            --color-border: #c7d5e0;
            --color-border-soft: #e8edf1;
            --color-accent: #d9622c;       --color-accent-rgb: 217, 98, 44;
            --color-elegant: #de9936;      --color-elegant-rgb: 222, 153, 54;
            --color-organize: #5d873d;     --color-organize-rgb: 93, 135, 61;
            --color-highlight: #cd2e26;    --color-highlight-rgb: 205, 46, 38;
        }

        /* =========================================================
           RESET & TIPOGRAFÍA (Estilo Awwwards Light Mode)
           ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--color-bg); /* Blanco oficial */
            color: var(--color-ink); /* Azul Oscuro oficial */
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* =========================================================
           CANVAS 3D BACKGROUND
           ========================================================= */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; 
            pointer-events: none; 
        }

        .front-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: transparent;
        }

        /* =========================================================
           HEADER ULTRA MINIMALISTA (Logo Centrado)
           ========================================================= */
        .header-minimal {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 30px 50px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            z-index: 100;
            background: rgba(247, 249, 251, 0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            border-bottom: 1px solid rgba(32, 58, 105, 0);
            box-shadow: 0 10px 30px rgba(32, 58, 105, 0);
            transition: background 0.4s ease, backdrop-filter 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }
        /* Al hacer scroll, el header gana un fondo esmerilado para que el texto
           que pasa por debajo no se mezcle visualmente con el logo y el menú. */
        .header-minimal.is-scrolled {
            background: rgba(247, 249, 251, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(32, 58, 105, 0.06);
            box-shadow: 0 10px 30px rgba(32, 58, 105, 0.05);
        }
        
        .nav-minimal {
            grid-column: 1;
            justify-self: start;
        }
        .nav-minimal ul {
            list-style: none;
            display: flex;
            gap: 40px;
        }
        .nav-minimal a {
            display: inline-block;
            color: #111820;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            text-transform: lowercase;
            letter-spacing: 1px;
            transition: color 0.3s ease, transform 0.15s ease;
        }
        .nav-minimal a:hover {
            color: #d9622c;
        }
        .nav-minimal a:active {
            color: #d9622c;
            transform: scale(0.92);
        }

        /* Logo oficial LMVE al centro del header */
        .logo-center-wrapper {
            grid-column: 2;
            justify-self: center;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            text-decoration: none;
            animation: logo-breathe 6s ease-in-out infinite;
            transform-origin: center;
        }
        .logo-mark-img {
            height: 52px;
            width: auto;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(32, 58, 105, 0.15));
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
        }
        .logo-center-wrapper:hover .logo-mark-img {
            transform: scale(1.08) rotate(-2deg);
            filter: drop-shadow(0 10px 20px rgba(217, 98, 44, 0.4));
        }
        .logo-center-wrapper:active .logo-mark-img {
            transform: scale(0.9);
            transition-duration: 0.1s;
        }
        @keyframes logo-breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.035); }
        }

        .header-right {
            grid-column: 3;
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .btn-minimal {
            border: 1px solid #c7d5e0;
            color: #203a69;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: transparent;
        }
        .btn-minimal:hover {
            background: #203a69;
            color: #ffffff;
            border-color: #203a69;
        }
        .btn-minimal:active {
            transform: scale(0.94);
            transition-duration: 0.1s;
        }

        /* =========================================================
           MENÚ MÓVIL (botón hamburguesa + panel de navegación)
           ========================================================= */
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 42px;
            height: 42px;
            border: 1px solid #c7d5e0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
            z-index: 210;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .menu-toggle:active {
            transform: scale(0.88);
        }
        .menu-toggle:disabled {
            opacity: 0.6;
        }
        .menu-toggle span {
            display: block;
            width: 18px;
            height: 2px;
            background: #203a69;
            border-radius: 2px;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }
        .menu-toggle.is-active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }
        .menu-toggle.is-active span:nth-child(2) {
            opacity: 0;
        }
        .menu-toggle.is-active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        .mobile-nav-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(247, 249, 251, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-12px);
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
        }
        .mobile-nav-overlay.is-open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .mobile-nav-overlay a {
            display: inline-block;
            color: #203a69;
            text-decoration: none;
            font-size: 12vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.15;
            transition: color 0.3s ease, transform 0.15s ease;
        }
        .mobile-nav-overlay a:hover {
            color: #d9622c;
        }
        .mobile-nav-overlay a:active {
            color: #d9622c;
            transform: scale(0.94);
        }
        .mobile-nav-overlay a.mobile-nav-cta {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            background: #d9622c;
            padding: 14px 36px;
            border-radius: 50px;
            text-transform: none;
        }
        .mobile-nav-overlay a.mobile-nav-cta:active {
            transform: scale(0.92);
            background: #b9531f;
        }

        /* =========================================================
           MAIN CONTENT AREA
           ========================================================= */
        .main-content {
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 150px 50px 100px 50px;
        }

        /* =========================================================
           FOOTER INVISIBLE
           ========================================================= */
        .footer-minimal {
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e8edf1;
            font-size: 12px;
            font-weight: 600;
            color: #93a0ac;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .footer-minimal a {
            display: inline-block;
            color: #93a0ac;
            text-decoration: none;
            transition: color 0.3s ease, transform 0.15s ease;
        }
        .footer-minimal a:hover {
            color: #d9622c;
        }
        .footer-minimal a:active {
            color: #d9622c;
            transform: scale(0.92);
        }
        .footer-lema {
            font-style: italic;
            color: #d9622c;
            letter-spacing: 0.5px;
        }

        /* =========================================================
           RESPONSIVE TREATMENT
           ========================================================= */
        @media (max-width: 900px) {
            .header-minimal {
                padding: 18px 20px;
            }
            .nav-minimal { display: none; }
            .header-right .btn-minimal { display: none; }
            .menu-toggle { display: flex; }
            .main-content { padding: 120px 20px 60px 20px; }
            .footer-minimal { flex-direction: column; gap: 20px; text-align: center; padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- CONTENEDOR DEL MOTOR 3D -->
    <div id="webgl-canvas"></div>

    <!-- CAPA FRONTAL CON CONTENIDO -->
    <div class="front-layer">
        
        <header class="header-minimal">
            <nav class="nav-minimal">
                <ul>
                    <li><a href="{% url 'proyecto' %}">el proyecto</a></li>
                    <li><a href="{% url 'impacto' %}">impacto</a></li>
                    <li><a href="{% url 'redes' %}">redes</a></li>
                </ul>
            </nav>
            
            <a href="{% url 'home' %}" class="logo-center-wrapper">
                <img src="{% static 'core/img/logo-mark.png' %}" alt="LMVE - Liga Metropolitana de Voleibol Escolar" class="logo-mark-img">
            </a>
            
            <div class="header-right">
                <a href="{% url 'contacto' %}" class="btn-minimal">Contacto</a>
                <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobileNav">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <nav class="mobile-nav-overlay" id="mobileNav">
            <a href="{% url 'home' %}">Inicio</a>
            <a href="{% url 'proyecto' %}">El Proyecto</a>
            <a href="{% url 'impacto' %}">Impacto</a>
            <a href="{% url 'redes' %}">Redes</a>
            <a href="{% url 'contacto' %}" class="mobile-nav-cta">Contacto</a>
        </nav>

        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>

        <footer class="footer-minimal">
            <div>&copy; 2026 LMVE. Todos los derechos reservados.</div>
            <div class="footer-lema">"Educar a Través del Deporte"</div>
            <div>
                <a href="#">Instagram</a> &nbsp;&nbsp;//&nbsp;&nbsp;
                <a href="#">TikTok</a>
            </div>
        </footer>

    </div>

    <!-- ESTADO DEL HEADER AL HACER SCROLL -->
    <script>
        const headerMinimal = document.querySelector('.header-minimal');
        function getScrollY() {
            return window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
        }
        function updateHeaderScrollState() {
            headerMinimal.classList.toggle('is-scrolled', getScrollY() > 40);
        }
        // El layout scrollea dentro de <body> (por el height:100% del html/body),
        // no en window, así que escuchamos en fase de captura para no depender
        // de cuál de los dos termine siendo el contenedor real con scroll.
        document.addEventListener('scroll', updateHeaderScrollState, { passive: true, capture: true });
        updateHeaderScrollState();
    </script>

    <!-- MENÚ MÓVIL (hamburguesa) -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const mobileNav = document.getElementById('mobileNav');

        function setMobileMenu(open) {
            menuToggle.classList.toggle('is-active', open);
            mobileNav.classList.toggle('is-open', open);
            menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            document.body.style.overflow = open ? 'hidden' : '';
        }

        menuToggle.addEventListener('click', () => {
            // Bloqueo breve para que un tap repetido no interrumpa la
            // animación a medio camino y se vea entrecortada.
            menuToggle.disabled = true;
            setMobileMenu(!mobileNav.classList.contains('is-open'));
            setTimeout(() => { menuToggle.disabled = false; }, 350);
        });

        mobileNav.querySelectorAll('a').forEach((link) => {
            link.addEventListener('click', () => setMobileMenu(false));
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') setMobileMenu(false);
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) setMobileMenu(false);
        });
    </script>

    <!-- SCRIPT DEL MOTOR 3D (THREE.JS) - VOLEIBOL REALISTA -->
    <script>
        const canvasContainer = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 35;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        canvasContainer.appendChild(renderer.domElement);

        const ballGroup = new THREE.Group();

        // 1. Núcleo Sólido Blanco Perla
        const coreGeo = new THREE.SphereGeometry(14, 64, 64);
        const coreMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            roughness: 0.1,
            metalness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.2
        });
        ballGroup.add(new THREE.Mesh(coreGeo, coreMat));

        // 2. Algoritmo de Costuras Matemáticas (18 Paneles de Voleibol)
        // Dibuja tubos que se adhieren perfectamente a la curvatura de la esfera
        class ArcCurve extends THREE.Curve {
            constructor(axisSweep, valA, valB, axisA, axisB) {
                super();
                this.axisSweep = axisSweep;
                this.valA = valA;
                this.valB = valB;
                this.axisA = axisA;
                this.axisB = axisB;
            }
            getPoint(t, optionalTarget = new THREE.Vector3()) {
                const sweep = (t * 2) - 1; // Mapea de 0..1 a -1..1
                optionalTarget.set(0, 0, 0);
                optionalTarget[this.axisSweep] = sweep;
                optionalTarget[this.axisA] = this.valA;
                optionalTarget[this.axisB] = this.valB;
                // Radio 14.1 para que sobresalga ligeramente del núcleo (14.0)
                optionalTarget.normalize().multiplyScalar(14.1);
                return optionalTarget;
            }
        }

        const seamMat = new THREE.MeshBasicMaterial({ color: 0xd9622c });

        // Función constructora de costuras
        function createSeam(axisSweep, valA, valB, axisA, axisB) {
            const curve = new ArcCurve(axisSweep, valA, valB, axisA, axisB);
            // TubeGeometry para darle grosor y estética premium a la línea
            const geo = new THREE.TubeGeometry(curve, 32, 0.15, 8, false);
            return new THREE.Mesh(geo, seamMat);
        }

        // ==========================================
        // DIBUJANDO LOS 18 PANELES DEL VOLEIBOL
        // ==========================================
        
        // Bordes Exteriores (El esqueleto principal)
        // Barrido en X
        ballGroup.add(createSeam('x', 1, 1, 'y', 'z'));
        ballGroup.add(createSeam('x', -1, 1, 'y', 'z'));
        ballGroup.add(createSeam('x', 1, -1, 'y', 'z'));
        ballGroup.add(createSeam('x', -1, -1, 'y', 'z'));
        // Barrido en Y
        ballGroup.add(createSeam('y', 1, 1, 'x', 'z'));
        ballGroup.add(createSeam('y', -1, 1, 'x', 'z'));
        ballGroup.add(createSeam('y', 1, -1, 'x', 'z'));
        ballGroup.add(createSeam('y', -1, -1, 'x', 'z'));
        // Barrido en Z
        ballGroup.add(createSeam('z', 1, 1, 'x', 'y'));
        ballGroup.add(createSeam('z', -1, 1, 'x', 'y'));
        ballGroup.add(createSeam('z', 1, -1, 'x', 'y'));
        ballGroup.add(createSeam('z', -1, -1, 'x', 'y'));

        // Costuras Internas (División en 3 franjas por cara)
        const d = 0.35; // Separación de las franjas
        
        // Costuras Verticales (Eje Z)
        ballGroup.add(createSeam('y', d, 1, 'x', 'z'));
        ballGroup.add(createSeam('y', -d, 1, 'x', 'z'));
        ballGroup.add(createSeam('y', d, -1, 'x', 'z'));
        ballGroup.add(createSeam('y', -d, -1, 'x', 'z'));
        
        // Costuras Horizontales (Eje X)
        ballGroup.add(createSeam('z', d, 1, 'y', 'x'));
        ballGroup.add(createSeam('z', -d, 1, 'y', 'x'));
        ballGroup.add(createSeam('z', d, -1, 'y', 'x'));
        ballGroup.add(createSeam('z', -d, -1, 'y', 'x'));
        
        // Costuras de Profundidad (Eje Y)
        ballGroup.add(createSeam('x', d, 1, 'z', 'y'));
        ballGroup.add(createSeam('x', -d, 1, 'z', 'y'));
        ballGroup.add(createSeam('x', d, -1, 'z', 'y'));
        ballGroup.add(createSeam('x', -d, -1, 'z', 'y'));

        // 2.5 Parche con el logo oficial LMVE, curvado sobre la propia esfera
        // (un recorte de SphereGeometry, no un plano) para que siga la
        // curvatura de la pelota y no se vea "flotando" al mirarla de lado.
        const textureLoader = new THREE.TextureLoader();
        const logoTexture = textureLoader.load('{% static "core/img/logo-mark.png" %}');
        const logoAspect = 961 / 794; // proporción real del recorte del logo
        const patchRadius = 14.3; // apenas por fuera de las costuras (radio 14.1)
        const logoHeight = 4.6;
        const logoWidth = logoHeight * logoAspect;
        const thetaExtent = logoHeight / patchRadius;
        const phiExtent = logoWidth / patchRadius;
        const logoDecalGeo = new THREE.SphereGeometry(
            patchRadius, 32, 32,
            Math.PI / 2 - phiExtent / 2, phiExtent,
            Math.PI / 2 - thetaExtent / 2, thetaExtent
        );
        const logoDecalMat = new THREE.MeshBasicMaterial({
            map: logoTexture,
            transparent: true,
            depthWrite: false,
            side: THREE.FrontSide
        });
        const logoDecal = new THREE.Mesh(logoDecalGeo, logoDecalMat);
        ballGroup.add(logoDecal);

        scene.add(ballGroup);

        // 3. Iluminación para resaltar el volumen
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(20, 20, 20);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xc7d5e0, 0.5); 
        fillLight.position.set(-20, -20, -20);
        scene.add(fillLight);

        // 4. Interactividad Suave (Lerp)
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.001;
            mouseY = (event.clientY - windowHalfY) * 0.001;
        });

        // 5. Motor de Animación
        function animate() {
            requestAnimationFrame(animate);

            // Rotación base diagonal
            ballGroup.rotation.y += 0.003;
            ballGroup.rotation.x += 0.002;
            ballGroup.rotation.z += 0.001;

            // Seguimiento del cursor con fricción (Lerping)
            targetX = mouseX * 2;
            targetY = mouseY * 2;
            ballGroup.position.x += (targetX - ballGroup.position.x) * 0.03;
            ballGroup.position.y += (-targetY - ballGroup.position.y) * 0.03;
            
            // Inclinación 3D
            ballGroup.rotation.x += (mouseY - ballGroup.rotation.x) * 0.05;
            ballGroup.rotation.y += (mouseX - ballGroup.rotation.y) * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        // 6. Adaptabilidad a pantallas
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
