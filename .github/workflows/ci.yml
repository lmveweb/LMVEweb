name: CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # DEBUG=True por defecto para todo el job: es lo que necesitan
    # collectstatic y los tests (sin esto, DEBUG=False exige SECRET_KEY
    # y activa SECURE_SSL_REDIRECT, que redirige con 301 cada request
    # del test client y hace fallar cualquier test que espere 200/400).
    # El paso de "check --deploy" abajo lo pisa a propósito con la
    # config real de producción, que es justo lo que tiene que probar.
    env:
      DJANGO_DEBUG: "True"

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Genera el manifest que necesita CompressedManifestStaticFilesStorage
      # para resolver los {% static %} de los templates. Sin este paso,
      # cualquier test que renderice una vista completa falla con
      # "Missing staticfiles manifest entry" en un checkout limpio (no
      # hay staticfiles/ commiteado, esta en .gitignore a propósito).
      - name: Recolectar estaticos
        run: python manage.py collectstatic --noinput

      - name: Tests
        run: python manage.py test

      - name: Chequeo de despliegue (settings de produccion)
        run: python manage.py check --deploy
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-use-0000000000
          DJANGO_ALLOWED_HOSTS: lmve.cl
